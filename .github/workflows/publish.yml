name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  MISE_LOCKED: "1"
  # the mise release the extension was last reviewed against: bump it after
  # going through the releases since (https://github.com/jdx/mise/releases).
  # Set in ci.yml and publish.yml
  REVIEWED_MISE_VERSION: "2026.10.20"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: ${{ env.REVIEWED_MISE_VERSION }}
          install: true
          cache: true

      - run: aube ci --frozen-lockfile
      - run: node --run lint
      - run: node --run ts-check
      - run: node --run build

  publish-vscode-openvsx:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: ${{ env.REVIEWED_MISE_VERSION }}
          install: true
          cache: true

      - run: aube ci --frozen-lockfile
      - run: node --run build

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12  # v2.1.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          dependencies: false

  publish-vscode-marketplace:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: ${{ env.REVIEWED_MISE_VERSION }}
          install: true
          cache: true

      - run: aube ci --frozen-lockfile
      - run: node --run build

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12  # v2.1.0
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          dependencies: false
