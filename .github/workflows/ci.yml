name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MISE_LOCKED: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          install: true
          cache: true

      - run: aube ci --frozen-lockfile
      - run: node --run lint
      - run: node --run ts-check
      - run: node --run test
      - run: node --run build

  # same build as .github/workflows/docs.yml, so a docs breakage (e.g. a
  # lockfile losing the docs importer) fails the PR instead of the deploy
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          install: true
          cache: true

      - name: Install docs dependencies
        working-directory: docs
        run: aube ci --frozen-lockfile
      - name: Build docs
        working-directory: docs
        run: aube run build

  e2e-tests:
    runs-on: ubuntu-latest
    name: e2e-tests (${{ matrix.group }})
    # the sdk-extensions and supported-extensions groups download SDKs and a
    # dozen extensions; a hung run would otherwise hold a runner for 6 hours
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # groups balanced by wall time; a config label must appear in
          # exactly one group (see .vscode-test.js for the labels)
          - group: core
            labels: default tool-versions bootstrap broken-config command-injection
          - group: workspaces
            labels: projects custom-extensions task-cache monorepo
          # multi-root and go share their toolchain store, so the go
          # downloads happen once when they run on the same runner
          - group: go
            labels: multi-root go
          # every prebuilt-binary tool of the supported-extensions docs table;
          # its own group since the suite downloads over a dozen tools and
          # marketplace extensions
          - group: supported-extensions
            labels: supported-extensions
          # the docs table rows whose tool is a full SDK (java, dotnet, pkl)
          - group: sdk-extensions
            labels: sdk-extensions

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          install: true
          cache: true

      - run: sudo apt update
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: 'libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libgtk-3-0 libx11-xcb1 libxcb-dri3-0 libxss1 xvfb dbus-x11'
          version: 1.0

      - run: aube ci --frozen-lockfile
      - run: node --run build
      # the pkl extension is not on the marketplace: its vsix comes from the
      # apple/pkl-vscode releases and is installed from a local file
      - if: contains(matrix.labels, 'sdk-extensions')
        run: node --run fetch-pkl-vsix
      - run: xvfb-run -a npx vscode-test --label ${{ matrix.labels }}
