version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '16:00'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # pinned to the minimum VS Code of engines.vscode, bumped with it
      - dependency-name: '@types/vscode'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '16:00'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
