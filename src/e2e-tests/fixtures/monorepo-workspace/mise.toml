monorepo_root = true

[monorepo]
config_roots = [
	"projects/*",
	"projects/backend/integration",
	"crates/*",
	"go/*",
]

# Go project dependencies are not inferred from go.mod; they are declared here
[monorepo.projects."go:example.com/fixture/gateway"]
depends = ["go:example.com/fixture/auth"]

# applied to every project task named `build`; ^build refers to the build
# tasks of the projects the owner project depends on
[monorepo.task_defaults.build]
env = { BUILT_WITH_DEFAULTS = "1" }
depends = ["^build"]

[task_templates.project-info]
description = "Show information about the project"
run = "echo 'project info'"

[settings]
# package.json script tasks and `mise tasks graph` are experimental-gated
experimental = true
# the declared tools are not installed, don't install them during test runs
task.run_auto_install = false
# pick up the node version declared in package.json devEngines
idiomatic_version_file_enable_tools = ["node"]

[tools]
# running package.json script tasks needs npm in the task env
node = "24"

[tasks.root-task]
description = "Task defined at the monorepo root"
run = "echo 'Hello from the monorepo root'"

[tasks.build-all]
description = "Build all the projects"
depends = ["//projects/...:build", "//crates/...:build"]

[tasks.verify]
description = "Covers name wildcards, wait_for, and depends_post"
depends = ["//projects/frontend:*"]
wait_for = ["build-all"]
depends_post = [":root-task"]
