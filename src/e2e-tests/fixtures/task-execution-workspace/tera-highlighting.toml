# Tera inside TOML strings, see https://github.com/hverlin/mise-vscode/issues/358
# The scripts of a run array are plain TOML strings, as every run script is with
# the TOML grammar of another extension (Tombi, Even Better TOML)
[tasks.deploy]
usage = 'arg "<stage>"'
run = ["""
mise run stage-exists {{ usage.stage }}
{% raw %}
if [[ ${#branch[@]} -gt 1 ]]; then
  b=$(choose branch)
fi
{% endraw %}
gh workflow run {{ usage.stage }}.yml
"""]

[tasks.since]
run = "git log {{ usage.since }}"

[tasks.unterminated]
run = ["""
echo {# a Tera comment without its end
"""]

[tasks.after]
run = "echo {{ usage.after }}"

[tasks.commented]
run = "echo {# a Tera comment #} {{ usage.commented }}"

# Tera in the arguments of a run script highlighted as shell
[tasks.shell-arguments]
run = """
gh workflow run deploy.yml -f ref={{ usage.ref }}
deploy --stage={{ usage.stage }} --verbose
echo pre{{ usage.middle }}post
sort < {{ usage.input }} > {{ usage.output }}
cat notes >out-{{ usage.name }}.log
{{ usage.command }} --version
# Deploying on "{{ usage.stage }}"
cat <<< {{ usage.herestring }}
cat <<EOF > {{ usage.heredoc }}
{{ usage.body }}
EOF
"""

# An unterminated comment in a run script highlighted as shell
[tasks.shell-unterminated]
run = """
echo {# a Tera comment without its end
"""

[tasks.after-shell-unterminated]
run = "echo {{ usage.after_shell }}"

# A brace expansion in a raw block starts with {{ but is not Tera
[tasks.brace-expansion]
run = """
{% raw %}
echo a{{b,c},d}
{% endraw %}
"""

[tasks.after-brace-expansion]
run = "echo {{ usage.after_braces }}"

[tasks.comment-with-braces]
run = "echo {# {{ #} {{ usage.after_comment }}"

# Scripts in other languages, picked by their shebang
[tasks.python]
run = '''
#!/usr/bin/env python
"""Greets someone."""
import json
name = "{{ usage.name }}"
{% raw %}
counts = {k: len(v) for k, v in {"a": [1]}.items()}
print(f"{{literal}} {counts}")
{% endraw %}
print(json.dumps({"name": name, "count": {{ usage.count }}}))
'''

[tasks.after-python]
run = "echo {{ usage.after_python }}"

[tasks.node]
run = """
#!/usr/bin/env node
const stage = '{{ usage.stage }}';
{% raw %}
class Counter {#count = 0; next() { return ++this.#count; }}
const label = `${stage}: ${new Counter().next()}`;
{% endraw %}
console.log(label, {{ usage.count }});
"""

[tasks.after-node]
run = "echo {{ usage.after_node }}"

[tasks.deno]
run = '''
#!/usr/bin/env -S deno run --allow-env
console.log(Deno.env.get("{{ usage.var }}"));
'''

[tasks.bun]
run = '''
#!/usr/bin/env bun
const { stdout } = Bun.spawnSync(["git", "log", "{{ usage.ref }}"]);
'''

[tasks.ruby]
run = '''
#!/usr/bin/env ruby
name = "{{ usage.name }}"
{% raw %}
config = {a: {b: 1}}
puts "Hello #{name} #{config}"
{% endraw %}
'''

[tasks.after-ruby]
run = "echo {{ usage.after_ruby }}"

[tasks.sh]
run = '''
#!/usr/bin/env sh
echo "{{ usage.name }}" ${#HOME}
'''

[tasks.after-sh]
run = "echo {{ usage.after_sh }}"

# Scripts whose closing quotes are followed by more TOML on the same line
[tasks.array-script]
run = ['''
#!/usr/bin/env python
print("{{ usage.array }}")
''', "echo {{ usage.done }}"]

[tasks.after-array-script]
run = "echo {{ usage.after_array }}"

[tasks.inline]
deploy = { run = """
#!/usr/bin/env node
console.log("{{ usage.inline }}")
""", description = "x" }
check = { run = ['''
#!/usr/bin/env sh
echo "{{ usage.nested }}"
'''] }

[tasks.after-inline]
run = "echo {{ usage.after_inline }}"

# Escaped quotes in a Tera string of a basic TOML string
[tasks.escaped]
run = "echo {{ exec(command=\"git rev-parse HEAD\") }}"

[tasks.after-escaped]
run = "echo {{ usage.after_escaped }}"

# A shebang in a shell comment or string does not start a script
[tasks.shebang-in-shell]
run = """
##!/usr/bin/env python
echo '#!/usr/bin/env bash' > x.sh
echo "{{ usage.after_shebang }}"
"""
